name: Auto-merge Codex PRs

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: codex-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge:
    name: Merge passing Codex PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'codex/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge-sha: ${{ steps.merge.outputs.merge-sha }}
    steps:
      - name: Find and merge pull request
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const branch = run.head_branch;
            const expectedHead = `${owner}:${branch}`;

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: "main",
              head: expectedHead,
              per_page: 10,
            });

            const pr = pulls.find((candidate) => candidate.head.sha === run.head_sha);
            if (!pr) {
              core.notice(`No open main-bound PR found for ${expectedHead} at ${run.head_sha}.`);
              core.setOutput("merged", "false");
              return;
            }

            if (pr.draft) {
              core.notice(`PR #${pr.number} is still a draft; skipping auto-merge.`);
              core.setOutput("merged", "false");
              return;
            }

            let mergeable = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const { data: current } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });
              mergeable = current.mergeable;
              if (mergeable !== null) break;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            if (mergeable !== true) {
              throw new Error(`PR #${pr.number} is not currently mergeable.`);
            }

            const result = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: "squash",
              commit_title: `${pr.title} (#${pr.number})`,
            });

            core.notice(`Merged PR #${pr.number}: ${result.data.sha}`);
            core.setOutput("merged", "true");
            core.setOutput("merge-sha", result.data.sha);

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              core.notice(`Deleted branch ${branch}.`);
            } catch (error) {
              core.notice(`Merged successfully, but could not delete ${branch}: ${error.message}`);
            }

  deploy:
    name: Deploy merged site
    runs-on: ubuntu-latest
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.merge-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: touch ./out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - uses: actions/deploy-pages@v5
        id: deployment
