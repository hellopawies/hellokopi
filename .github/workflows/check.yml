name: Build check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only token — this job only needs to check out source and run a build.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # Build needs these to be set; real values come from secrets in deploy.
          # Placeholder is fine here — the supabase client tolerates a fake URL at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
