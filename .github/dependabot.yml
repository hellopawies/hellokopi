# Dependabot keeps dependencies patched automatically.
# Security alerts are on by default for public repos; this file additionally
# enables grouped weekly version-update PRs so the lockfile doesn't drift.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps instead of a flood of singletons.
      dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
